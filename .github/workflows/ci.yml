name: Verify OpenSCAD model and build printable parts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenSCAD and testing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb xauth
          openscad --version
          python -m pip install -r requirements-dev.txt
      - name: Test and export STLs and preview screenshots
        run: make check
      - name: Upload rendered STLs and preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: drawer-organizer-v8-build
          path: |
            build/*.stl
            build/previews/*.png
          if-no-files-found: error
