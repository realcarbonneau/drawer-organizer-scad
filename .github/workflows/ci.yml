name: Verify OpenSCAD model and build printable parts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Serialize builds for the same branch. Multiple simultaneous pushes used to
# race while publishing the gallery back to main.
concurrency:
  group: drawer-organizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenSCAD and testing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb xauth fonts-dejavu-core
          openscad --version
          python -m pip install -r requirements-dev.txt
          python -m pip check
          # Verify trimesh's optional graph backend before costly STL tests.
          python -c "from scipy.sparse.csgraph import connected_components, depth_first_order; import networkx; from PIL import Image; import trimesh; print('Mesh analysis and gallery dependencies OK')"
      - name: Test and export STLs and preview screenshots
        run: make check
      - name: Generate README product screenshot gallery
        run: python -m scripts.readme_gallery --input build/previews --output docs/images
      - name: Upload rendered STLs and preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: drawer-organizer-v9-review-build
          path: |
            build/*.stl
            build/previews/*.png
            docs/images/*.png
            drawer-organizer-v9.scad
            drawer-organizer-v9.json
            scripts/*.py
            tests/*.py
            requirements-dev.txt
          if-no-files-found: error
      - name: Publish README gallery to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A later push may have advanced main. Let that newer run publish
          # the matching screenshots rather than failing a non-FF git push.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main has advanced; skipping stale screenshot publication."
            exit 0
          fi
          git add docs/images/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh README screenshots [skip ci]'
            git push origin HEAD:main
          fi
