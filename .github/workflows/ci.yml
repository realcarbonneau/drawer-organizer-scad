name: Verify OpenSCAD model and build printable parts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Serialize builds for the same branch. Multiple simultaneous pushes used to
# race while publishing the gallery back to main.
concurrency:
  group: drawer-organizer-v12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenSCAD and testing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb xauth fonts-dejavu-core
          openscad --version
          python -m pip install -r requirements-dev.txt
          python -m pip check
          # Verify trimesh's optional graph backend before costly STL tests.
          python -c "from scipy.sparse.csgraph import connected_components, depth_first_order; import networkx; from PIL import Image; import trimesh; print('Mesh analysis and gallery dependencies OK')"
      - name: Test and export STLs and preview screenshots
        run: |
          if [ "$GITHUB_REF" = "refs/heads/preview/rotate-loose-connectors-z90" ]; then
            python -m pytest -q tests/test_config.py tests/test_openscad.py -k 'preview or full_layout or config'
            python - <<'PY'
          from pathlib import Path
          from scripts.organizer_cli import openscad_render,require_render_ok
          from scripts.chamfer_docs import uniform_frame
          p=Path("build/previews/full-layout.png")
          r=openscad_render(p,{"Output_mode":0,"Preview_separation_mm":12,"Render_facets":64},
              image_focus=(107,250,37,58,0,35,1500),timeout=240)
          require_render_ok(r,p)
          o=Path("docs/images/cad/full-layout.png")
          o.parent.mkdir(parents=True,exist_ok=True)
          uniform_frame(p,name="full-layout").save(o,optimize=True)
          print("Generated actual v12 OpenSCAD full-layout screenshot:",o)
          PY
          else
            make check
          fi
      - name: Generate README product screenshot gallery
        if: github.ref != 'refs/heads/preview/rotate-loose-connectors-z90'
        run: python -m scripts.readme_gallery --input build/previews --output docs/images
      - name: Generate v12 build-plate geometry inspection close-ups
        if: github.ref != 'refs/heads/preview/rotate-loose-connectors-z90'
        run: python -m scripts.chamfer_docs --output docs/images
      - name: Upload rendered STLs and preview screenshots
        if: github.ref != 'refs/heads/preview/rotate-loose-connectors-z90'
        uses: actions/upload-artifact@v4
        with:
          name: drawer-organizer-v12-review-build
          path: |
            build/*.stl
            build/previews/*.png
            docs/images/*.png
            drawer-organizer-v12.scad
            drawer-organizer-v12.json
            scripts/*.py
            tests/*.py
            requirements-dev.txt
          if-no-files-found: error
      - name: Commit generated CAD reference images to the source branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A later push may have advanced this branch. Let that newer run publish
          # the matching screenshots rather than failing a non-FF git push.
          branch="${GITHUB_REF#refs/heads/}"
          git fetch origin "$branch"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$branch")" ]; then
            echo "Branch has advanced; skipping stale screenshot publication."
            exit 0
          fi
          git add docs/images/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh README screenshots [skip ci]'
            git push origin "HEAD:$branch"
          fi
