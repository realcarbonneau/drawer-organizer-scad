name: Publish default cutlery STL sets

on:
  push:
    branches: [main]
    paths:
      - drawer-organizer-v12.scad
      - drawer-organizer-v12.json
      - scripts/export_stls.py
      - scripts/organizer_cli.py
      - .github/workflows/export-stls.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutlery-stls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-stls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenSCAD and mesh requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install numpy trimesh networkx scipy
      - name: Export two deduplicated tray sets and one loose connector
        run: python -m scripts.export_stls --output STLs
      - name: Upload printable STL collections
        uses: actions/upload-artifact@v4
        with:
          name: MAXIMERA-Cutlery-v12-STLs
          path: STLs/
          if-no-files-found: error
      - name: Commit exported STL collections
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STLs/
          if git diff --cached --quiet; then
            echo "STLs already up to date."
            exit 0
          fi
          git commit -m 'Publish MAXIMERA cutlery STL sets [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
