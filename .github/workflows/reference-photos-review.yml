name: Capture drawer reference photographs for README
on:
  push:
    paths:
      - .github/workflows/reference-photos-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Download reference photos and resize without cropping
        shell: bash
        run: |
          python - <<'PY'
          import io, requests
          from PIL import Image, ImageOps
          from pathlib import Path
          from urllib.parse import quote

          out=Path('reference-review')
          out.mkdir(exist_ok=True)
          originals={
            'ikea-manufacturer': [
              'https://www.ikea.com/ca/en/images/products/maximera-drawer-high-white__0625584_pe692375_s5.jpg?f=s',
              'https://www.ikea.com/ca/en/images/products/maximera-drawer-high-white__0625584_pe692375_s5.jpg',
            ],
            'maximera-commons': [
              'https://upload.wikimedia.org/wikipedia/commons/8/81/Maximera_drawer_without_front.jpg',
            ],
            'blum-leevalley': [
              'https://www.leevalley.com/_next/image?url=https%3A%2F%2Fimages.contentstack.io%2Fv3%2Fassets%2Fblt050573defaf102e3%2Fblt28b0ee032f9e7f70%2F669bd304c607cdd6287e11c7%2Fhttps_assets.leevalley.com_Size5_10006_02K2440-blum-tandembox-antaro-soft-close-drawer-kit-type-m-400mm-15-3-4-inch-l-x-68mm-2-5-8-h-f-40.jpg%3Fbranch%3Dproduction&w=640&q=75',
              'https://images.contentstack.io/v3/assets/blt050573defaf102e3/blt28b0ee032f9e7f70/669bd304c607cdd6287e11c7/https_assets.leevalley.com_Size5_10006_02K2440-blum-tandembox-antaro-soft-close-drawer-kit-type-m-400mm-15-3-4-inch-l-x-68mm-2-5-8-h-f-40.jpg?branch=production'
            ],
            'maximera-commons-detail':[
              'https://upload.wikimedia.org/wikipedia/commons/6/60/Maximera_Side_Piece_Detail_2.jpg',
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Maximera_Side_Piece_Detail_2.jpg',
            ],
          }
          for name,urls in originals.items():
            for u in urls:
              try:
                r=requests.get(u,timeout=25,headers={'User-Agent':'Mozilla/5.0 (compatible; DrawerOrganizerReference/1.0; contact: github.com/realcarbonneau/drawer-organizer-scad)'})
                print(name,r.status_code,r.headers.get('content-type'),len(r.content),u[:100],flush=True)
                r.raise_for_status()
                im=Image.open(io.BytesIO(r.content))
                im=ImageOps.exif_transpose(im).convert('RGB')
                print('ORIGINAL',name,im.size,flush=True)
                im.thumbnail((1320,1320),Image.Resampling.LANCZOS)
                im.save(out/(name+'.jpg'),format='JPEG',quality=86,optimize=True,progressive=True)
                print('SAVED',name,im.size,flush=True)
                break
              except Exception as ex:
                print('FAILED',name,str(ex)[:200],flush=True)
            else:
              print('MISSING',name,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reference-drawer-review-photos
          path: reference-review/
          if-no-files-found: error
