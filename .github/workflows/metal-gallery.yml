name: Render metal cabinet drawer gallery

on:
  push:
    branches: [main]
    paths:
      - drawer-organizer-v12.scad
      - drawer-organizer-v12.json
      - scripts/metal_gallery.py
      - scripts/organizer_cli.py
      - .github/workflows/metal-gallery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metal-drawer-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenSCAD and image dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb xauth fonts-dejavu-core
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Render genuine OpenSCAD 3D and orthographic views
        run: python -m scripts.metal_gallery --output docs/images/cad
      - name: Publish four metal drawer preview images
        uses: actions/upload-artifact@v4
        with:
          name: metal-cabinet-drawer-4-views
          path: docs/images/cad/metal-drawer-*.png
          if-no-files-found: error
      - name: Commit actual CAD gallery images
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/cad/metal-drawer-*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Render metal cabinet drawer CAD views [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
